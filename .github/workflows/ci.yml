name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to validate (for example 2.0.2); dispatch is a dry run'
        required: true
        type: string

# One run per ref: a force-push or a new PR commit cancels the superseded run.
concurrency:
  group: ci-${{ startsWith(github.ref, 'refs/tags/') && 'release' || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  core:
    name: core (JDK 25, jeno)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      # freeway is built by jeno now. The modules carry jeno.toml/jeno.lock; the
      # cascade (module N's jar must exist before module N+1 locks) is what
      # build.sh walks, because jeno resolves coordinates before it looks at a
      # workspace. Central publishing stays out of CI; this workflow publishes
      # the gh-pages repository.
      - name: install jeno
        run: |
          curl -fsSL https://github.com/dzb/jeno-cargo/releases/latest/download/install.sh -o /tmp/install-jeno.sh
          bash /tmp/install-jeno.sh
          echo "$HOME/.jeno/bin" >> "$GITHUB_PATH"
      - name: Build and test (7 modules, cascade)
        run: ./build.sh
      - name: Upload the jeno repository
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: freeway-repo
          path: vendor/
          if-no-files-found: error
          retention-days: 1
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jeno-test-logs
          path: build-logs/
          if-no-files-found: ignore

  consumers:
    name: in-repo consumers (demos)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # The core's only in-repo consumers. "The compile error is the migration
      # path" only holds while something compiles against the API, and until
      # this job existed nothing did.
      # The demos are standalone POMs, so their freeway.version is a literal.
      # Pin it to the reactor's version here: a stale literal silently resolves
      # a snapshot from a repository (or fails once that snapshot is gone)
      # instead of testing the sources under review.
      - name: Build core and demos
        run: |
          VERSION=$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)
          mvn -B -ntp -Pdemos verify -Dgpg.skip=true -Dfreeway.version="$VERSION"

  ext:
    name: ext adapters against this core
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # The adapters pin exact core versions, and their parent POM is this
      # repository's root. The clone is disposable, so align the cloned ext
      # reactor to this core's version before building: its project version,
      # parent version and freeway.version property all move together. This
      # keeps internal ext modules in the reactor while their core dependencies
      # resolve to the build under review. What stays verified is the thing
      # that matters — adapter sources against this core — without requiring
      # both repositories to move in lockstep.
      - name: Install core artifacts
        run: mvn -B -ntp -DskipTests -Dgpg.skip=true install
      - name: Check out adapters
        run: git clone --depth 1 https://github.com/dzb/freeway-ext.git freeway-ext
      - name: Align the adapters with this core
        id: align
        run: |
          CORE=$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)
          EXT=$(sed -n '/<parent>/,/<\/parent>/p' freeway-ext/pom.xml \
            | sed -n 's|.*<version>\(.*\)</version>.*|\1|p')
          echo "adapters on $EXT, this core is $CORE"
          if [ "$EXT" != "$CORE" ]; then
            echo "::warning::adapters are on $EXT while core is on $CORE — aligning the disposable checkout"
            find freeway-ext -name pom.xml -print0 \
              | xargs -0 sed -i "s|$EXT|$CORE|g"
          fi
      - name: Build and test adapters
        run: mvn -B -ntp -f freeway-ext/pom.xml clean test

  docs:
    name: docs consistency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Fast, focused gate: English-only, naming/placement, link integrity,
      # index coverage and javadoc doc-path references. The core job runs the
      # same tests as part of verify; this job makes a docs-only regression
      # visible without waiting for the full build.
      - name: Documentation checks
        run: >-
          mvn -B -ntp -pl freeway-boot -am test
          -Dtest=ConfigDocsConsistencyTest,DocsLayoutConsistencyTest
          -Dsurefire.failIfNoSpecifiedTests=false

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  release:
    name: release jeno repository
    needs: [core, consumers, ext, docs]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: install jeno
        run: |
          curl -fsSL https://github.com/dzb/jeno-cargo/releases/latest/download/install.sh -o /tmp/install-jeno.sh
          bash /tmp/install-jeno.sh
          echo "$HOME/.jeno/bin" >> "$GITHUB_PATH"
      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Release gate
        run: ./ci/release-gate.sh "$VERSION"
      - name: Download the built jeno repository
        uses: actions/download-artifact@v4
        with:
          name: freeway-repo
          path: vendor
      - name: Package the offline repository
        run: |
          mkdir -p dist
          tar -czf "dist/freeway-repo-$VERSION.tar.gz" -C vendor .
          (cd dist && sha256sum "freeway-repo-$VERSION.tar.gz" > "freeway-repo-$VERSION.tar.gz.sha256")
      - name: Publish gh-pages (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./ci/publish-pages.sh "$VERSION"
      - name: Smoke-consume from Pages (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./ci/smoke-consume.sh "$VERSION"
      - name: Build release notes (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PAGES="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          {
            cat "docs/releases/release-notes-$VERSION.md"
            printf '\n\n## Consume this release\n\n'
            printf 'jeno repository (GitHub Pages):\n\n```toml\n'
            printf '[limits]\nmax-depth = 3\n\n'
            printf '[repos.freeway]\ntype = "jeno"\nurl = "%s/"\n\n' "$PAGES"
            printf '[deps]\n"freeway-ioc" = "freeway:%s"\n```\n\n' "$VERSION"
            printf 'Raise `max-depth` for the deepest module you consume (boot 4, http 5, cloud 6).\n\n' 
            printf 'Offline tarball: download `freeway-repo-%s.tar.gz`, extract it, then use:\n\n' "$VERSION"
            printf '```toml\n[repos.freeway]\ntype = "jeno"\nurl = "/path/to/freeway-repo"\n```\n\n' 
            printf 'Central remains the Maven channel; its bytes may differ from the Pages repository.\n'
          } > dist/release-notes.md
      - name: Create GitHub release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "$GITHUB_REF_NAME" --yes || true
          gh release create "$GITHUB_REF_NAME" \
            --title "Freeway $VERSION" \
            --notes-file dist/release-notes.md \
            "dist/freeway-repo-$VERSION.tar.gz" \
            "dist/freeway-repo-$VERSION.tar.gz.sha256"
