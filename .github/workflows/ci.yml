name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# One run per ref: a force-push or a new PR commit cancels the superseded run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: core (JDK 25, jeno)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      # freeway is built by jeno now. The modules carry jeno.toml/jeno.lock; the
      # cascade (module N's jar must exist before module N+1 locks) is what
      # build.sh walks, because jeno resolves coordinates before it looks at a
      # workspace. publish stays out of CI: Central is released by hand, and
      # the gh: track is `jeno publish`.
      - name: install jeno
        run: |
          curl -fsSL https://raw.githubusercontent.com/dzb/jeno-cargo/master/setup.sh | bash
          echo "$HOME/.jeno/bin" >> "$GITHUB_PATH"
      - name: Build and test (7 modules, cascade)
        run: ./build.sh
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jeno-test-logs
          path: build-logs/
          if-no-files-found: ignore

  consumers:
    name: in-repo consumers (demos)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # The core's only in-repo consumers. "The compile error is the migration
      # path" only holds while something compiles against the API, and until
      # this job existed nothing did.
      # The demos are standalone POMs, so their freeway.version is a literal.
      # Pin it to the reactor's version here: a stale literal silently resolves
      # a snapshot from a repository (or fails once that snapshot is gone)
      # instead of testing the sources under review.
      - name: Build core and demos
        run: |
          VERSION=$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)
          mvn -B -ntp -Pdemos verify -Dgpg.skip=true -Dfreeway.version="$VERSION"

  ext:
    name: ext adapters against this core
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # The adapters pin exact core versions, and their parent POM is this
      # repository's root: the clone lands inside this checkout, so
      # `../pom.xml` is `freeway-parent`. When the two version lines differ —
      # ext on 2.0.1 while this tree is on 2.0.1-SNAPSHOT — that relative path
      # carries the wrong version and Maven falls back to Central, which holds
      # only released parents. Drift is not what this job is about, so align
      # instead of failing: install this root POM under ext's own version and
      # point the adapter dependencies at this build. What stays verified is the
      # thing that matters — adapter sources against the core under review —
      # without the two repositories moving in lockstep.
      - name: Install core snapshot
        run: mvn -B -ntp -DskipTests -Dgpg.skip=true install
      - name: Check out adapters
        run: git clone --depth 1 https://github.com/dzb/freeway-ext.git freeway-ext
      - name: Align the adapters with this core
        id: align
        run: |
          CORE=$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)
          EXT=$(sed -n '/<parent>/,/<\/parent>/p' freeway-ext/pom.xml \
            | sed -n 's|.*<version>\(.*\)</version>.*|\1|p')
          echo "adapters on $EXT, this core is $CORE"
          if [ "$EXT" != "$CORE" ]; then
            echo "::warning::adapters are on $EXT while core is on $CORE — building them against this core"
            mvn -B -ntp -q install:install-file \
              -Dfile="$HOME/.m2/repository/com/jujin8/freeway/freeway-parent/$CORE/freeway-parent-$CORE.pom" \
              -DgroupId=com.jujin8.freeway -DartifactId=freeway-parent -Dversion="$EXT" \
              -Dpackaging=pom -DgeneratePom=false
          fi
          echo "CORE=$CORE" >> "$GITHUB_ENV"
      - name: Build and test adapters
        run: mvn -B -ntp -Dfreeway.version="$CORE" -f freeway-ext/pom.xml clean test

  docs:
    name: docs consistency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Fast, focused gate: English-only, naming/placement, link integrity,
      # index coverage and javadoc doc-path references. The core job runs the
      # same tests as part of verify; this job makes a docs-only regression
      # visible without waiting for the full build.
      - name: Documentation checks
        run: >-
          mvn -B -ntp -pl freeway-boot -am test
          -Dtest=ConfigDocsConsistencyTest,DocsLayoutConsistencyTest
          -Dsurefire.failIfNoSpecifiedTests=false

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
