app.name=Dev Boot
server.port=9191
# A profile file must never redefine which profiles are active — profile
# selection comes from the base layers only. This (re)declaration of the
# activation key is stripped from the merged config view (see
# ConfigLoaderDefault.BootConfigLayers.merged()), so config().get("freeway.profile")
# and config().profiles() cannot fork.
freeway.profile=prod
