# ═══════════════════════════════════════════════════════════════
# Freeway 日志默认配置
# ═══════════════════════════════════════════════════════════════
# 此文件随 freeway-commons 打包在 classpath 根。
# 应用可放置同名文件在自己的 src/main/resources/ 下覆盖。
# 最高优先：-Djava.util.logging.config.file=/absolute/path.properties
#
# Formatter 由 JULLoggerServiceProvider.installFormatters() 统一管理：
#   ConsoleHandler → JULConsoleFormatter  (ANSI 色彩、缩写类名)
#   FileHandler    → JULFileFormatter     (ISO 8601、完整类名、无色彩)
#   JULFileHandler → JULFileFormatter
# 覆盖：-Dfreeway.log.format=simple  回到 JUL 原生 SimpleFormatter

# ── 默认 Handler ────────────────────────────────────────────────
# 框架内置 ConsoleHandler 保证日志不会静默消失。
# 用户可追加 FileHandler 或 JULFileHandler 开启文件日志。
handlers=java.util.logging.ConsoleHandler

# ── 全局日志级别 ────────────────────────────────────────────────
.level=INFO

# ── ConsoleHandler ────────────────────────────────────────────
java.util.logging.ConsoleHandler.level=INFO
# formatter 由代码设定，此处不配

# ── JUL FileHandler（JDK 内置，大小滚动） ──────────────────────
# 取消注释开启文件日志。formatter 由 installFormatters() 自动设为 JULFileFormatter。
# java.util.logging.FileHandler.pattern=logs/app.%g.log
# java.util.logging.FileHandler.formatter=com.jujin.freeway.commons.logging.JULFileFormatter
# java.util.logging.FileHandler.limit=104857600
# java.util.logging.FileHandler.count=10
# java.util.logging.FileHandler.append=true
# java.util.logging.FileHandler.level=INFO
# handlers=java.util.logging.ConsoleHandler, java.util.logging.FileHandler

# ── Freeway JULFileHandler（时间 + 大小双滚动，GZIP 压缩） ─────
# 通过 JVM 系统属性激活，无需在 logging.properties 注册 handler：
#   -Dfreeway.log.file=logs/app.log
#   -Dfreeway.log.file.max-size=104857600   # 默认 100 MB
#   -Dfreeway.log.file.max-history=30       # 默认 30 天
#   -Dfreeway.log.file.compress=true        # 默认 true
#
# 或在代码中程序化注册：
#   Logger.getLogger("").addHandler(new JULFileHandler("logs/app.log", ...));
#
# JULFileHandler 特性：
#   - 当前文件固定为指定路径（如 logs/app.log）
#   - 滚动后重命名为 app.2026-06-30.log 或 app.2026-06-30.1.log
#   - 压缩后后缀 .gz，自动清理 max-history 天前的文件

# ── Freeway ANSI 色彩控制 ─────────────────────────────────────
# 自动检测：有控制台 → 开，管道/重定向 → 关
# -Dfreeway.log.color=always     强制开启
# -Dfreeway.log.color=never      强制关闭
# 环境变量：NO_COLOR=true  也可关闭（遵循 https://no-color.org 规范）

# ── 按包/类细粒度控制级别 ──────────────────────────────────────
# com.jujin.freeway.http.level=FINE
# com.jujin.freeway.db.level=FINE
# org.hibernate.level=WARNING
# com.zaxxer.hikari.level=WARNING
